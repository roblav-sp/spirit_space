name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test — WSL MinGW cross-compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y mingw-w64 make pkg-config curl zip unzip tar git

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: vcpkg_installed
          key: vcpkg-mingw-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-mingw-

      - name: Install vcpkg dependencies
        run: make setup VCPKG_ROOT=$HOME/vcpkg

      - name: Build
        run: make VCPKG_ROOT=$HOME/vcpkg

      - name: Build tests
        run: make tests VCPKG_ROOT=$HOME/vcpkg

      - name: Validate GLSL shaders
        run: |
          if [ -d "src/shaders" ]; then
            find src/shaders -name "*.vert" -o -name "*.frag" -o -name "*.glsl" | \
              xargs -I{} glslangValidator {}
          else
            echo "No shaders yet — skipping validation."
          fi
